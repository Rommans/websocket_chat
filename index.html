<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws://localhost:8080 wss://websocket-chat-s2s0.onrender.com; img-src 'self' data:; media-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    >
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=a3ee601c1e">
    <title>WS Chat</title>
</head>
<body>
    <main class="app">
        <section class="chat-shell" aria-label="WebSocket chat">
            <header class="chat-header">
                <div class="chat-title">
                    <p class="eyebrow">Live room</p>
                    <h1>WS Chat</h1>
                    <p id="roomName" class="room-name">#general</p>
                </div>
                <div class="header-actions">
                    <div class="notify-control">
                        <button
                            id="notifyToggle"
                            class="notify-btn"
                            type="button"
                            aria-label="Notification settings"
                            aria-expanded="false"
                            aria-controls="notifyMenu"
                            title="Notifications"
                        >
                            <svg class="icon-bell" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/>
                                <path d="M10 21h4"/>
                            </svg>
                            <svg class="icon-bell-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/>
                                <path d="M10 21h4"/>
                                <path d="M4 4l16 16"/>
                            </svg>
                        </button>
                        <div id="notifyMenu" class="notify-menu" role="group" aria-label="Notifications" hidden>
                            <label class="notify-option">
                                <input id="notifyDesktop" type="checkbox">
                                <span>Desktop notifications</span>
                            </label>
                            <label class="notify-option">
                                <input id="notifySound" type="checkbox">
                                <span>Sound</span>
                            </label>
                            <p id="notifyHint" class="notify-hint" hidden></p>
                        </div>
                    </div>
                    <div class="connection-pill" data-status="connecting">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span id="connectionStatus">Connecting</span>
                    </div>
                </div>
            </header>

            <div class="room-layout">
                <aside class="sidebar" aria-label="Online users">
                    <div class="sidebar-header">
                        <button
                            id="sidebarToggle"
                            class="sidebar-toggle"
                            type="button"
                            aria-label="Collapse online users panel"
                            aria-expanded="true"
                            title="Collapse panel"
                        >
                            <span aria-hidden="true"></span>
                        </button>
                        <span class="sidebar-title">Online</span>
                        <strong class="online-count">0</strong>
                    </div>
                    <ul id="usersList" class="users-list"></ul>
                </aside>

                <section class="conversation" aria-label="Messages">
                    <div class="messages-pane">
                        <div id="dropOverlay" class="drop-overlay" hidden>
                            <span>Drop file to send</span>
                        </div>

                        <div id="chat" class="messages" aria-live="polite">
                            <div class="empty-state">
                                <span>Start the conversation</span>
                                <p>No messages yet.</p>
                            </div>
                        </div>

                        <button
                            id="scrollToBottom"
                            class="scroll-to-bottom"
                            type="button"
                            hidden
                            aria-label="Scroll to latest messages"
                            title="Scroll to bottom"
                        >
                            ↓
                        </button>
                    </div>

                    <p id="typingIndicator" class="typing-indicator" aria-live="polite"></p>
                    <p id="connectionNotice" class="connection-notice" hidden aria-live="polite"></p>

                    <div id="replyBar" class="reply-bar" hidden>
                        <div>
                            <span>Replying to <strong id="replyAuthor"></strong></span>
                            <p id="replyPreview"></p>
                        </div>
                        <button id="cancelReply" type="button" aria-label="Cancel reply">x</button>
                    </div>

                    <form class="composer">
                        <input id="fileInput" type="file" hidden>
                        <button class="attach-btn" type="button" disabled aria-label="Attach file" title="Attach file">
                            +
                        </button>
                        <textarea
                            id="message"
                            rows="1"
                            placeholder="Message or paste an image"
                            disabled
                        ></textarea>
                        <button class="submit-btn" type="submit" disabled aria-label="Send message">
                            Send
                        </button>
                    </form>
                </section>
            </div>
        </section>

        <section id="nameModal" class="name-modal" aria-labelledby="nameTitle" aria-modal="true" role="dialog">
            <form id="nameForm" class="name-card">
                <p class="eyebrow">Choose your name</p>
                <h2 id="nameTitle">Jump into the room</h2>
                <input
                    id="username"
                    type="text"
                    maxlength="24"
                    autocomplete="nickname"
                    placeholder="Your name"
                    required
                >
                <button type="submit">Join chat</button>
            </form>
        </section>

        <div id="photoViewer" class="photo-viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
            <div class="viewer-toolbar">
                <div class="viewer-caption">
                    <strong id="viewerAuthor"></strong>
                    <span id="viewerMeta"></span>
                </div>
                <div class="viewer-actions">
                    <a id="viewerDownload" class="viewer-btn" download aria-label="Download photo" title="Download">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
                    </a>
                    <button id="viewerClose" class="viewer-btn" type="button" aria-label="Close viewer" title="Close (Esc)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
            </div>
            <div id="viewerStage" class="viewer-stage">
                <img id="viewerImage" class="viewer-image" alt="" draggable="false">
            </div>
            <button id="viewerPrev" class="viewer-nav viewer-prev" type="button" aria-label="Previous photo" title="Previous (←)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button id="viewerNext" class="viewer-nav viewer-next" type="button" aria-label="Next photo" title="Next (→)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
        </div>
    </main>

    <script src="chat.js?v=c1b9ed52da"></script>
</body>
</html>
